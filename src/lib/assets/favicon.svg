<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f4f0e8"/>

  <!-- O outline + the single horizontal line that turns it into a G -->
  <g stroke="#7a8f5f" stroke-width="2.6" fill="none" stroke-linecap="round">
    <circle cx="32" cy="28" r="14"/>
    <line x1="44" y1="28" x2="34" y2="28"/>
  </g>

  <!-- 'GO ART' subtitle -->
  <text x="32" y="54" font-family="Helvetica, Arial, sans-serif" font-size="6.5" font-weight="600" fill="#7a8f5f" text-anchor="middle" letter-spacing="3">GO ART</text>
</svg>
